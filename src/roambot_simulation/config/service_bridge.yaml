# Service robot motion, sensors, and state.
# /clock is already bridged once by scout_bridge.yaml.

- ros_topic_name: "/service/cmd_vel"
  gz_topic_name: "/model/service/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/service/odom"
  gz_topic_name: "/model/service/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/service/joint_states"
  gz_topic_name: "/model/service/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

- ros_topic_name: "/service/tf"
  gz_topic_name: "/model/service/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

- ros_topic_name: "/service/scan"
  frame_id: "service/lidar_link"
  gz_topic_name: "/model/service/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS
