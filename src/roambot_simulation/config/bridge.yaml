# Gazebo simulation time -> ROS time
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# ROS driving command -> Gazebo DiffDrive plugin
- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/model/roambot/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# Gazebo odometry estimate -> ROS
- ros_topic_name: "/odom"
  gz_topic_name: "/model/roambot/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS
